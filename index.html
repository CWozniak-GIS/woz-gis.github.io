<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chris Wozniak</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      background: #0d1116;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    .container {
      max-width: 500px;
    }

    .profile-pic {
  		width: 16rem;
  		height: 16rem;
  		border-radius: 50%;
  		object-fit: cover;
  		display: block;
  		margin: 0 auto 1.5rem auto;
  		border: 4px solid #1e293b;
  		transition: transform 0.25s ease, border-color 0.25s ease;
		}
    
    .profile-pic:hover {
  		transform: scale(1.05);
  		border-color: #94a3b8;
		}
    
    h1 {
      font-size: 3rem;
      margin-top: 0rem;
      margin-bottom: 2rem;
      transition: letter-spacing 0.3s ease, transform 0.3s cubic-bezier(0.35, 1.5, 0.65, 1);
    }
    
    h1:hover {
      letter-spacing: 0.06rem;
      transform: translateY(-2px) scale(1.04);
    }
    
    .roles {
    display: flex;
    justify-content: center;
    gap: 0.75rem;
    flex-wrap: wrap;
    margin-bottom: 6rem;
  	}

    .roles span {
    padding: 0.4rem 0.8rem;
    background: #1e293b;
    border-radius: 999px;
    font-size: 0.9rem;
    color: #94a3b8;
    transition: transform 0.25s cubic-bezier(0.35, 1.5, 0.65, 1),
                background 0.2s ease,
                color 0.2s ease;
  	}

    .roles span:hover {
    color: #e2e8f0;
    transform: translateY(-2px) scale(1.03);
  	}

    a {
      display: block;
      margin: 2rem 0;
      padding: 1.25rem;
      background: #1e293b;
      color: #e2e8f0;
      text-decoration: underline;
      border-radius: 8px;
      transition: transform 0.4s cubic-bezier(0.75, -1.5, 0.25, 3),
        					background 0.4s ease,
        					color 0.4s ease;
    }

    a:hover {
      background: #334155;
      transform: scale(1.1) translateY(-4px);
  	}
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="https://woz-gis.com/assets/profile.png" alt="Profile picture" class="profile-pic">
    <h1>Chris Wozniak</h1>
    <div class="roles">
  		<span>Program Leadership</span>
      <span>Enterprise GIS</span>
      <span>Systems Architecture</span>
      <span>Automation</span>
  		<span>Applciation Development</span>
      <span>Cartography</span>
    </div>
    <a href="https://woz-gis.com/portfolio" target="_blank">
    <!--- <a href="https://arcg.is/0S485v" target="_blank"> --->
      Portfolio <!--- (ArcGIS StoryMaps Collection) --->
    </a>

    <a href="https://www.linkedin.com/in/chriswozniak1/" target="_blank">
      LinkedIn
    </a>
    
    <a href="https://github.com/CWozniak-GIS" target="_blank">
      GitHub
    </a>
  </div>
</body>
</html>
