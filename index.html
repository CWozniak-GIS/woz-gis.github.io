<!DOCTYPE html>
<html lang="en">
<head>
  
  <link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  />
  <meta charset="UTF-8">
  <title>Woz GIS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <style>
    
    html {
		scroll-behavior: smooth;
	}

	#links {
		scroll-margin-top: 10vh;
	}
    
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      background: #0d1116;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 4rem 1rem;
      text-align: center;
    }

    .container {
      user-select: none;
    }

    .profile-pic {
  		width: 24rem;
  		height: 24rem;
  		border-radius: 50%;
  		object-fit: cover;
  		display: block;
  		margin: 4rem auto 2rem auto;
  		border: 6px solid #1e293b;
  		transition: transform 0.25s ease, border-color 0.25s ease;
		}
    
    .profile-pic:hover {
  		transform: scale(1.05);
  		border-color: #94a3b8;
		}
    
    h1 {
      font-size: 4rem;
      margin: 4rem auto 12rem auto;
      transition: letter-spacing 0.3s ease, transform 0.3s cubic-bezier(0.35, 1.5, 0.65, 1);
    }
    
    h1:hover {
      letter-spacing: 0.1rem;
      transform: translateY(-4px) scale(1.04);
    }

    
    .links {
     max-width: 48rem;
     min-width: 48rem;
    }

    h2 {
      font-size: 2rem;
      color: #94a3b8;
      margin-top: -2rem;
      margin-bottom: 0rem;
    }
    
    @keyframes pulse {
      0% {
        transform: scale(1) translateY(-0.1rem);
        opacity: 5%;
        color: #94a3b8;
      }
      50% {
        transform: scale(1.2) translateY(0.6rem);
        opacity: 100%;
        color: #94a3b8;
      }
      100% {
        transform: scale(1) translateY(-0.1rem);
        opacity: 5%;
        color: #94a3b8;
      }
    }
    
    .pulse-arrow {
      display: inline-block;
      color: #0d1116;
      font-size: 2rem;
      margin: -2rem auto 6rem auto;
      background: none;
      padding: 0;
      border-radius: 0;
      animation: pulse 3s infinite ease-in-out;
      animation-delay: 1.25s;
      
    }
    
    .pulse-arrow:hover {
      background: none;
    }
    
    .link-text {
      text-decoration: underline;
    }

    a {
      font-size: 1.2rem;
      display: block;
      margin: 3rem 0;
      padding: 1.6rem;
      background: #1e293b;
      color: #e2e8f0;
      text-decoration: none;
      border-radius: 8rem;
      transition: transform 0.4s cubic-bezier(0.75, -1.5, 0.25, 3),
        					background 0.4s ease,
        					color 0.4s ease;
    }

    a:hover {
      background: #334155;
      transform: scale(1.1) translateY(-4px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    
    .roles {
      max-width: 38rem;
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin: 4rem auto 8rem auto;
  	}
    
    .roles span {
      padding: 0.4rem 1rem;
      border-radius: 0.5rem;
      font-size: 1.1rem;
      color: #94a3b8;
      transition: letter-spacing 0.3s ease, transform 0.3s cubic-bezier(0.35, 1.5, 0.65, 1)
    }
    
    .roles span:hover {
      letter-spacing: 0.05rem;
      transform: translateY(-4px) scale(1.2);
    }
    
  </style>
</head>
<body>
  
    <!---

  <div class="container">

        <a href="https://www.linkedin.com/in/chriswozniak1/" target="_blank">
          <i class="fa-brands fa-linkedin" style="color: #0077b5;"></i>&ensp;<span class="link-text">LinkedIn</span>

        <a href="https://www.credly.com/users/chris-woz/" target="_blank">
          <i class="fa-solid fa-award" style="color: rgb(99, 230, 190);"></i>&ensp;<span class="link-text">Certifications</span>

          <i class="fa-solid fa-envelope-circle-check" style="color: rgb(150, 180, 200);"></i>&ensp;<span class="link-text">Email</span>

      </div>
    </section>
    
    <div class="roles">
      <span>Development</span>
      <span>Project Management</span>

      <span>Enterprise GIS</span>
      <span>Systems Architecture</span>
      <span>Program Leadership</span>
      <span>Part 107 Pilot</span>
    </div>

    <footer style="margin-top: 6rem; font-size: 0.8rem; color: #94a3b8;">
       © <span id="year"></span> Woz GIS
    </footer>
    
      <script>
        document.getElementById("year").textContent = new Date().getFullYear();
    	</script>

  </div>

</body>
</html>
