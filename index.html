  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      background: #0d1116;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;

    }

    .container {

    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      transition: transform 0.2s
    }
    
    h1:hover {
    transform: scale(1.03);
    }

    p {

      margin-bottom: 6rem;
      transition: transform 0.2s
    }
    
    p:hover {
    transform: scale(1.02);
    }

      display: block;
      margin: 3rem 0;

      color: #e2e8f0;
      text-decoration: underline;
      border-radius: 8px;
      transition: transform 0.4s cubic-bezier(0.75, -1.5, 0.25, 3);
    }

    a:hover {
      background: #334155;
      transform: scale(1.1);
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
